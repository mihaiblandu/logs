# Agent collector in front of all six services. It only receives, fixes PHP metrics and forwards;
# storage-specific processing (log format, filters, the telemetry standard) stays in the backend
# collector (e.g. spring-otel/elk/otel-collector.yaml).
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  # Laravel only: PHP builds a fresh SDK per request, so each metric point says "cumulative since
  # this request started" - which is really that request's delta. Relabel it as delta, then
  # accumulate into one long-lived cumulative series. The other SDKs already export cumulative
  # metrics, which deltatocumulative leaves untouched.
  transform/php-per-request-delta:
    error_mode: ignore
    metric_statements:
      - context: metric
        statements:
          # no-op for gauges; a `where metric.type == ...` condition did not match in 0.130
          - set(metric.aggregation_temporality, AGGREGATION_TEMPORALITY_DELTA) where IsMatch(resource.attributes["service.name"], "^laravel-otel-")
  deltatocumulative: {}
  batch: {}

exporters:
  otlphttp:
    endpoint: ${env:BACKEND_OTLP_ENDPOINT}

service:
  pipelines:
    traces:  { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlphttp] }
    logs:    { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlphttp] }
    metrics: { receivers: [otlp], processors: [memory_limiter, transform/php-per-request-delta, deltatocumulative, batch], exporters: [otlphttp] }
