receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  batch: {}

exporters:
  # Loki 3.x ingests OTLP natively (resource attrs -> labels / structured metadata)
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  # Loki stores logs only; traces and metrics are dropped here
  nop: {}

service:
  pipelines:
    logs:    { receivers: [otlp], processors: [batch], exporters: [otlphttp/loki] }
    traces:  { receivers: [otlp], exporters: [nop] }
    metrics: { receivers: [otlp], exporters: [nop] }
