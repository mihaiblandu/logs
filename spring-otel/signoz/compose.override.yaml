# Remaps SigNoz's OTLP ports so it can run next to the LGTM stack (which owns 4317/4318).
# pours/ is generated by `foundryctl forge` and must not be edited by hand.
services:
  ingester:
    ports: !override
      - "4357:4317"   # OTLP gRPC
      - "4358:4318"   # OTLP HTTP  -> OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4358
