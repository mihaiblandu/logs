receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  batch: {}

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s
    username: default
    password: otel
    database: otel
    create_schema: true   # creates otel_logs, otel_traces, otel_metrics_* tables
    ttl: 72h

service:
  pipelines:
    traces:  { receivers: [otlp], processors: [batch], exporters: [clickhouse] }
    metrics: { receivers: [otlp], processors: [batch], exporters: [clickhouse] }
    logs:    { receivers: [otlp], processors: [batch], exporters: [clickhouse] }
