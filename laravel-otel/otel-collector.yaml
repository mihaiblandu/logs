# Sidecar between PHP and the backend. PHP builds a fresh SDK per request, so each metric
# point says "cumulative since this request started" - which is really that request's delta.
# Relabel it as delta, then accumulate into one long-lived cumulative series for Prometheus.
receivers:
  otlp:
    protocols:
      http: { endpoint: 0.0.0.0:4318 }

processors:
  transform/per-request-delta:
    metric_statements:
      - context: metric
        statements:
          # no-op for gauges; a `where metric.type == ...` condition did not match in 0.130
          - set(metric.aggregation_temporality, AGGREGATION_TEMPORALITY_DELTA)
  deltatocumulative: {}
  batch: {}

exporters:
  otlphttp:
    endpoint: ${env:BACKEND_OTLP_ENDPOINT}

service:
  pipelines:
    traces:  { receivers: [otlp], processors: [batch], exporters: [otlphttp] }
    logs:    { receivers: [otlp], processors: [batch], exporters: [otlphttp] }
    metrics: { receivers: [otlp], processors: [transform/per-request-delta, deltatocumulative, batch], exporters: [otlphttp] }
