name: laravel-otel

x-app-env: &app-env
  APP_ENV: local
  APP_DEBUG: "false"
  LOG_CHANNEL: stderr
  LOG_LEVEL: debug
  DB_CONNECTION: sqlite
  QUEUE_CONNECTION: database
  CACHE_STORE: array
  SESSION_DRIVER: array
  DOWNSTREAM_URL: http://host.docker.internal:4242   # /api/chain -> the Spring app
  JWT_SECRET: ${JWT_SECRET:-dev-only-shared-secret-change-me-0123456789abcdef}
  KIBANA_URL: http://localhost:5601

  # --- OpenTelemetry ---
  OTEL_PHP_AUTOLOAD_ENABLED: "true"
  # no "process" detector: under `artisan serve` process.command holds the request's query
  # string (leaks request data, and makes every request a new metric stream); pid differs per worker
  OTEL_PHP_DETECTORS: env,sdk   # OTEL_RESOURCE_ATTRIBUTES + telemetry.sdk.*; no host/os/process (shared resource standard)
  OTEL_PROPAGATORS: tracecontext,baggage
  OTEL_TRACES_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  # Log::info('msg', ['a.b' => 1]) -> attribute a.b instead of one nested "context" attribute
  OTEL_PHP_LARAVEL_LOG_ATTRIBUTES_FLATTEN: "true"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./database:/app/database   # sqlite file shared with the queue worker
    depends_on: [otel-collector]
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: laravel-otel-api
      OTEL_METRICS_EXPORTER: otlp
      # fixed instance id: every request is a new SDK, so one stable series is needed for delta->cumulative
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local,service.namespace=demo,service.version=1.0.0,team=observability,service.instance.id=laravel-1

  # runs RunTodoCascade jobs (the cascade through all services)
  queue:
    build: .
    command: ["php", "artisan", "queue:work", "--tries=1", "--sleep=0.2"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./database:/app/database
    depends_on: [app, otel-collector]
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: laravel-otel-worker
      SKIP_MIGRATIONS: "1"   # the app container migrates
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local,service.namespace=demo,service.version=1.0.0,team=observability,service.instance.id=laravel-worker-1
      OTEL_PHP_TRACE_CLI_ENABLED: "true"
      # `queue:work` polls the jobs table every 0.2s and each poll would be its own trace (~2k spans
      # per 15 min). Jobs carry their dispatcher's context, so keep only spans that have a parent.
      OTEL_TRACES_SAMPLER: parentbased_always_off
      # long-running process without a background thread: export each span/log right away,
      # otherwise the last batch waits for the next job
      OTEL_PHP_TRACES_PROCESSOR: simple
      OTEL_PHP_LOGS_PROCESSOR: simple
      # a worker's metrics would only be exported on shutdown
      OTEL_METRICS_EXPORTER: none

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # where telemetry finally goes: ELK by default; LGTM :4318, ClickHouse :4338, Loki :4348, SigNoz :4358
      BACKEND_OTLP_ENDPOINT: ${BACKEND_OTLP_ENDPOINT:-http://host.docker.internal:4328}
